# ============================================================================
# flyte-eks wrapper — STABLE defaults for the EKS add-on.
#
# Everything here is a fixed, EKS-native default. Per-deployment values (Aurora
# endpoint, S3 bucket, region, ingress host, cert/Cognito ARNs) are supplied at
# install time by CloudFormation via the add-on `configurationValues`, or by
# scripts/render-config.sh for the helm-fallback path. Both merge ON TOP of the
# keys below, so the two install paths are byte-equivalent.
#
# All keys are namespaced under `flyteBinary:` — the Chart.yaml `alias` for the
# flyte-binary subchart. EKS add-on configuration parameters must be camelCase,
# so the subchart is aliased rather than addressed by its kebab-case real name.
# That is exactly the shape the add-on configurationValues must take, since EKS
# merges the blob straight into the packaged chart's values.
# ============================================================================

flyteBinary:
  # The alias above also renames .Chart.Name inside the subchart, and its
  # fullname helper is `<release>-<chart name>`. Without this override every
  # rendered resource would be `flyte-flyteBinary-*` — not a valid DNS-1123
  # name, and a break for everything that addresses flyte-flyte-binary-http
  # (smoke-test.sh, cloudformation/root.yaml, render-config.sh HTTP_SERVICE_NAME).
  nameOverride: flyte-binary

  # ---- Images: all relocated into the Marketplace ECR ----------------------
  # Marketplace requires every image — including open-source dependencies like
  # postgres — to be served from the listing's own ECR repository, with an
  # explicit tag. References must be defined here in values.yaml and nowhere
  # else, so AWS can rewrite the registry when replicating across regions.
  # Source images and tags are the MP_IMAGES table in versions.env, which
  # scripts/validate.sh cross-checks against this file.

  # Flyte 2 backend (flyte-binary-v2).
  deployment:
    image:
      repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/union-ai/flyte-eks-add-on
      tag: flyte-binary-v2.0.48-r1
    # initContainer that waits for Aurora to accept connections.
    waitForDB:
      image:
        repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/union-ai/flyte-eks-add-on
        tag: postgres-15-alpine-r1

    # ---- Mount the DB password secret into the backend pod ----------------
    # NOTE: exact key names for extra volumes are verified in scripts/validate.sh
    # against the vendored chart. The secret `flyte-db-credentials` is created by
    # the CloudFormation bootstrap custom resource before the add-on installs.
    extraVolumes:
      - name: db-secret
        secret:
          secretName: flyte-db-credentials
    extraVolumeMounts:
      - name: db-secret
        mountPath: /etc/db/secret
        readOnly: true

  # Flyte web console (flyteconsole-v2). Upstream publishes only commit-SHA
  # tags and floats `latest`; a floating tag fails Marketplace ingestion with
  # MISSING_IMAGE_TAG, so this is pinned to the commit latest resolved to.
  console:
    image:
      repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/union-ai/flyte-eks-add-on
      tag: flyteconsole-21b4f4bf69f3538a656effc9c8c95cd1450e2088-r1

  # Connector service (nested subchart of flyte-binary).
  flyteconnector:
    image:
      repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/union-ai/flyte-eks-add-on
      tag: flyte-connectors-py3.12-v2.3.6-r1

  # Data offload prefix for the unified Flyte manager. Set per-deploy to
  # s3://<provisioned-bucket> (see render-config.sh / configurationValues).
  flyte-core-components:
    runs:
      storagePrefix: ""

  # ---- Object store: S3 via EKS Pod Identity (no static keys) --------------
  configuration:
    # FlyteCopilot sidecar injected into task pods — same backend image.
    co-pilot:
      image:
        repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/union-ai/flyte-eks-add-on
        tag: flyte-binary-v2.0.48-r1

    storage:
      provider: s3
      # NOTE: metadataContainer and s3.region below are PLACEHOLDERS, not usable
      # defaults. The upstream chart wraps both in `required`, and Marketplace
      # validates a submitted chart by running `helm template` with DEFAULT
      # VALUES ONLY — no config file. Empty strings there fail ingestion with
      # INVALID_HELM_TEMPLATE. Both are marked required in
      # aws_mp_configuration_schema.json, so EKS rejects an install that does not
      # override them and these values can never reach a running cluster.
      #
      # metadataContainer is the only container key in flyte-binary v2 (there is
      # no userDataContainer). Set per-deploy from the provisioned bucket name.
      metadataContainer: "unset"
      providerConfig:
        s3:
          # `iam` = use the pod's ambient credentials (Pod Identity role).
          # No accessKey/secretKey — those must never be set.
          authType: iam
          region: "us-east-1"   # per-deploy; overridden by CloudFormation

    # ---- External Aurora Serverless v2 (PostgreSQL) ------------------------
    # v2 reads the connection from configuration.database.postgres.* — the flat
    # configuration.database.* keys used by flyte-binary v1 are ignored here.
    database:
      postgres:
        username: flyte
        dbname: flyte
        host: "unset"         # per-deploy: Aurora cluster writer endpoint
                              # (placeholder — schema-required, see storage above)
        port: 5432
        # Password is NOT inlined. It is mounted from a Kubernetes Secret the
        # CloudFormation bootstrap creates (synced from Secrets Manager) and read
        # via passwordPath. Leave `password` unset so the chart creates no Secret.
        # Deliberately absent from aws_mp_configuration_schema.json: the add-on
        # config surface must not appear to collect secret material.
        passwordPath: /etc/db/secret/password
        options: "sslmode=require"

    # Extra backend config merged into the generated Flyte config.
    inline:
      executor:
        # Task pods run under a dedicated, S3-only service account (created by
        # bootstrap.sh and bound to the S3 role via EKS Pod Identity — see
        # cloudformation/iam.yaml). Without this, tasks fall to the namespace
        # `default` SA, which has no bucket credentials, and every task hangs
        # ~144s on IMDS before failing. (Flyte v2 install docs, step 4.)
        defaultK8sServiceAccount: flyte-task

  # ---- Service account bound to the S3 IAM role via PodIdentityAssociation --
  # The name is FIXED so the CloudFormation AWS::EKS::PodIdentityAssociation can
  # reference (namespace=flyte, serviceAccount=flyte-backend) deterministically.
  # `create: true` is required by Marketplace: a buyer installing from the EKS
  # console may attach permissions to this SA, which only works if the chart
  # creates it.
  serviceAccount:
    create: true
    name: flyte-backend
    # No IRSA annotation needed: EKS Pod Identity binds the role out-of-band.
    annotations: {}

  # ---- Ingress: AWS Load Balancer Controller (ALB) -------------------------
  # `create` and host/annotations are turned on per-deploy only in prod mode
  # (custom domain). Dev mode leaves ingress off and uses port-forward / NLB.
  ingress:
    create: false
    ingressClassName: alb
    separateGrpcIngress: true
    host: ""                  # per-deploy: flyte.<domain>

  # Reasonable production-lean defaults; overridable per-deploy.
  replicaCount: 2
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
