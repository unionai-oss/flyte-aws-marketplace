AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Flyte 2 shared auth substrate. Cognito user pool + hosted-UI domain + resource
  server + OAuth2 clients for the ALB-native auth model both products use: a
  confidential "console" client driven by ALB authenticate-cognito, a public PKCE
  "cli" client, and an optional machine-to-machine client for CI. Every value that
  differs between the devbox and EKS products is a Parameter/Condition set by the
  product's root.yaml — no product-specific conditionals are hard-coded here.

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the user pool and client names.
  FlyteHost:
    Type: String
    Description: >-
      Fully-qualified host Flyte is served at (devbox passes <domain>, EKS passes
      flyte.<domain>). The console client callback is https://<FlyteHost>/oauth2/idpresponse.
  CognitoDomainPrefix:
    Type: String
    Description: Globally-unique prefix for the Cognito hosted-UI domain.
  CliCallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:53593/callback"
    Description: >-
      Callback URLs for the public PKCE (cli) client. Default is the flyte SDK
      default port. The devbox passes its own list (localhost:8089 etc.).
  ResourceServerIdentifier:
    Type: String
    Default: "https://flyte"
    Description: OAuth2 resource-server identifier. The custom API scope is <Identifier>/<ScopeName>.
  ResourceServerScopeName:
    Type: String
    Default: "all"
    Description: Resource-server scope name.
  CreateM2MClient:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create a client_credentials (M2M) client — devbox uses it for CI, EKS does not.
  IncludeApiScope:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      When true, the console and cli clients also request the custom resource-server
      scope and carry a logout URL (devbox behaviour). EKS leaves this false.

Conditions:
  WantM2M: !Equals [!Ref CreateM2MClient, "true"]
  WantApiScope: !Equals [!Ref IncludeApiScope, "true"]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${NamePrefix}-flyte"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Ref ResourceServerIdentifier
      Name: flyte
      Scopes:
        - ScopeName: !Ref ResourceServerScopeName
          ScopeDescription: Full Flyte access

  # Confidential client for the browser flow: ALB `authenticate-cognito` uses it
  # to run the console SSO login. Its callback is ALB's fixed /oauth2/idpresponse.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      ClientName: !Sub "${NamePrefix}-console"
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes: !If
        - WantApiScope
        - [openid, email, profile, !Sub "${ResourceServerIdentifier}/${ResourceServerScopeName}"]
        - [openid, email, profile]
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "https://${FlyteHost}/oauth2/idpresponse"
      LogoutURLs:
        - !Sub "https://${FlyteHost}/logout"
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # Public (no-secret) PKCE client for the SDK/CLI. The API is protected by ALB
  # JWT validation, which accepts a valid Cognito token from any client; this one
  # lets the SDK do an interactive PKCE login.
  UserPoolClientCli:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      ClientName: !Sub "${NamePrefix}-cli"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes: !If
        - WantApiScope
        - [openid, email, profile, !Sub "${ResourceServerIdentifier}/${ResourceServerScopeName}"]
        - [openid, email, profile]
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CliCallbackUrls
      LogoutURLs: !If
        - WantApiScope
        - [!Sub "https://${FlyteHost}/logout"]
        - !Ref "AWS::NoValue"
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # ---- Hosted-UI branding (colour scheme + logo) ----
  # Cognito sets the hosted-UI logo only through the SetUICustomization API, so a
  # logo needs a Lambda. That is why there was no logo here: the first attempt
  # put the Lambda's code and its PNG in a seller S3 bucket, which AWS Marketplace
  # rejects as an external dependency it can neither ingest nor scan ("Lambda code
  # hosted in seller S3 buckets are not ingested nor scanned").
  #
  # The image does NOT have to be a separate file. Base64 it into an inline
  # ZipFile and it is just source code in the template - ingested and scanned like
  # the four other inline Lambdas this product already ships. ZipFile allows 4 MB
  # and Cognito allows 128 KB of base64; the logo below is ~22 KB, so both have
  # room to spare. No external dependency, and the logo is back.
  #
  # ONE WRITER. SetUICustomization replaces the whole customization, so the CSS
  # cannot stay in a UserPoolUICustomizationAttachment while a Lambda writes the
  # image - whichever ran last would wipe the other. The CSS moved in here with
  # it, and the attachment is gone.
  #
  # Lives in the shared auth stack so every product's login page matches. Only
  # Cognito-allowed selectors/properties work here; see docs/brand-palette.md.
  LoginBrandingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: set-ui-customization
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cognito-idp:SetUICustomization, cognito-idp:GetUICustomization]
                Resource: !GetAtt UserPool.Arn

  LoginBrandingFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt LoginBrandingRole.Arn
