          def handler(event, context):
            try:
              c = boto3.client('cognito-idp')
              pool = event['ResourceProperties']['UserPoolId']
              if event['RequestType'] == 'Delete':
                # The pool is going away with the stack; nothing to undo, and
                # failing here would only strand a DELETE.
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {}); return
              c.set_ui_customization(
                UserPoolId=pool, ClientId='ALL',
                CSS=event['ResourceProperties']['CSS'],
                ImageFile=base64.b64decode(LOGO_B64))
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
              cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e)[:200])

  LoginBranding:
    Type: Custom::LoginBranding
    # Customization attaches to the hosted UI, so the domain must exist first.
    DependsOn: UserPoolDomain
    Properties:
      ServiceToken: !GetAtt LoginBrandingFn.Arn
      UserPoolId: !Ref UserPool
      # Passed as a property rather than baked into the function so the palette
      # stays visible in the template and a change here redeploys the resource.
      CSS: |
        /* Union/Flyte brand — Cognito Hosted UI (light theme, purple accents). */
        .background-customizable { background-color: #F5F6F8; }        /* grey-95 page */
        .banner-customizable { background-color: #FCFDFD; }            /* grey-99 banner */
        .label-customizable { color: #1D1E1F; }                        /* grey-10 text */
        .textDescription-customizable { color: #434648; }              /* grey-30 */
        .inputField-customizable { border-color: #B1B5B7; }            /* grey-60 */
        .inputField-customizable:focus { border-color: #6F43C0; }      /* purple-50 */
        .submitButton-customizable { background-color: #6F43C0; }      /* purple-50 primary */
        .submitButton-customizable:hover { background-color: #5A32A4; }/* purple-40 hover */

  # Machine-to-machine client for CI (client-credentials). Optional.
  UserPoolClientM2M:
    Type: AWS::Cognito::UserPoolClient
    Condition: WantM2M
    DependsOn: UserPoolResourceServer
    Properties:
      ClientName: !Sub "${NamePrefix}-m2m"
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Sub "${ResourceServerIdentifier}/${ResourceServerScopeName}"
      SupportedIdentityProviders:
        - COGNITO

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  UserPoolClientId:
    Description: Confidential client id used by ALB authenticate-cognito.
    Value: !Ref UserPoolClient
  CliClientId:
    Description: Public PKCE client id for the SDK/CLI.
    Value: !Ref UserPoolClientCli
  M2MClientId:
    Condition: WantM2M
    Description: client_credentials client id for CI.
    Value: !Ref UserPoolClientM2M
  CognitoDomainPrefix:
    Value: !Ref CognitoDomainPrefix
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  Issuer:
    Description: OIDC issuer / JWT iss; JWKS is <issuer>/.well-known/jwks.json.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
