<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
    <style>
      .lbl{font-size:15px;fill:#1b2733;font-weight:600}
      .sub{font-size:12.5px;fill:#5b6b7c}
      .tiny{font-size:11.5px;fill:#7a8894}
      .grp{font-size:12px;fill:#8a97a3;font-weight:700;letter-spacing:.9px}
      .box{fill:#fff;stroke:#c9d3dd;stroke-width:1.5;rx:8}
      .flow{stroke:#5b6b7c;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .flow2{stroke:#9aa7b4;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1400" height="715" fill="#f7f9fb"/>
  <text x="48" y="52" font-size="25" font-weight="700" fill="#1b2733">Flyte 2 Devbox on AWS</text>
  <text x="48" y="76" class="sub">One CloudFormation stack: a single EC2 host running the full Flyte 2 control plane, with managed data services and Cognito sign-in.</text>

  <!-- AWS cloud -->
  <rect x="40" y="100" width="1320" height="585" rx="12" fill="#fdfefe" stroke="#b8c4d0" stroke-width="1.5"/>
  <text x="62" y="128" class="grp">AWS CLOUD  ·  us-east-1</text>

  <!-- Regional / edge services -->
  <rect x="62" y="146" width="250" height="196" class="box"/>
  <text x="80" y="172" class="grp">EDGE &amp; IDENTITY</text>
  <rect x="80" y="186" width="214" height="44" rx="6" fill="#eef4fa" stroke="#c9d3dd"/>
  <text x="94" y="204" class="lbl">Route 53</text><text x="94" y="221" class="tiny">A record (Prod mode)</text>
  <rect x="80" y="238" width="214" height="44" rx="6" fill="#eef4fa" stroke="#c9d3dd"/>
  <text x="94" y="256" class="lbl">ACM</text><text x="94" y="273" class="tiny">TLS cert, auto-validated</text>
  <rect x="80" y="290" width="214" height="44" rx="6" fill="#f2eefa" stroke="#cdc4e0"/>
  <text x="94" y="308" class="lbl">Cognito</text><text x="94" y="325" class="tiny">user pool + hosted UI</text>

  <!-- VPC -->
  <rect x="336" y="146" width="700" height="330" rx="10" fill="#f4f8fc" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="356" y="172" class="grp">VPC  ·  10.20.0.0/16  ·  2 PUBLIC SUBNETS</text>

  <rect x="358" y="188" width="286" height="70" rx="7" fill="#fff" stroke="#c9d3dd"/>
  <text x="376" y="214" class="lbl">Application Load Balancer</text>
  <text x="376" y="233" class="tiny">Cognito authenticate + JWT validation</text>
  <text x="376" y="249" class="tiny">listener rules — auth enforced here, not in-app</text>

  <rect x="358" y="278" width="286" height="60" rx="7" fill="#fff" stroke="#c9d3dd"/>
  <text x="376" y="302" class="lbl">Elastic IP</text>
  <text x="376" y="320" class="tiny">Eval mode — direct HTTP, CIDR-restricted</text>

  <!-- EC2 host -->
  <rect x="676" y="188" width="336" height="196" rx="8" fill="#fff" stroke="#8fa8c0" stroke-width="2"/>
  <text x="696" y="214" class="lbl">EC2 devbox host</text>
  <text x="696" y="232" class="tiny">m6i.2xlarge default · Ubuntu 24.04 · prebuilt AMI</text>
  <rect x="696" y="244" width="296" height="122" rx="6" fill="#f7f9fb" stroke="#c9d3dd"/>
  <text x="712" y="266" class="sub" font-weight="700">Docker → k3s</text>
  <rect x="712" y="276" width="128" height="34" rx="5" fill="#eef4fa" stroke="#c9d3dd"/>
  <text x="724" y="297" class="sub">flyte-binary</text>
  <rect x="848" y="276" width="128" height="34" rx="5" fill="#eef4fa" stroke="#c9d3dd"/>
  <text x="860" y="297" class="sub">console /v2</text>
  <rect x="712" y="318" width="128" height="34" rx="5" fill="#eef4fa" stroke="#c9d3dd"/>
  <text x="724" y="339" class="sub">connectors</text>
  <rect x="848" y="318" width="128" height="34" rx="5" fill="#eef4fa" stroke="#c9d3dd"/>
  <text x="860" y="339" class="sub">task pods</text>

  <rect x="676" y="398" width="212" height="58" rx="7" fill="#fff" stroke="#c9d3dd"/>
  <text x="696" y="422" class="lbl">EBS data volume</text>
  <text x="696" y="440" class="tiny">50 GB, encrypted — retained on teardown</text>

  <!-- Auto-stop -->
  <rect x="1060" y="146" width="276" height="330" rx="10" fill="#fffdf5" stroke="#e0d3a8" stroke-width="1.5"/>
  <text x="1080" y="172" class="grp">COST CONTROL</text>
  <rect x="1080" y="188" width="236" height="58" rx="6" fill="#fff" stroke="#c9d3dd"/>
  <text x="1096" y="212" class="lbl">Idle agent</text><text x="1096" y="230" class="tiny">reports activity every minute</text>
  <rect x="1080" y="258" width="236" height="58" rx="6" fill="#fff" stroke="#c9d3dd"/>
  <text x="1096" y="282" class="lbl">CloudWatch alarm</text><text x="1096" y="300" class="tiny">idle &gt; 30 min (configurable)</text>
  <rect x="1080" y="328" width="236" height="58" rx="6" fill="#fff" stroke="#c9d3dd"/>
  <text x="1096" y="352" class="lbl">Stop Lambda</text><text x="1096" y="370" class="tiny">stops the instance</text>
  <rect x="1080" y="398" width="236" height="58" rx="6" fill="#fff" stroke="#c9d3dd"/>
  <text x="1096" y="422" class="lbl">Wake Lambda</text><text x="1096" y="440" class="tiny">next request restarts it</text>

  <!-- Data services -->
  <rect x="336" y="510" width="700" height="150" rx="10" fill="#f6fbf7" stroke="#a8c9b0" stroke-width="1.5"/>
  <text x="356" y="536" class="grp">MANAGED DATA  ·  RETAINED ON STACK DELETE</text>
  <rect x="358" y="552" width="216" height="86" rx="7" fill="#fff" stroke="#c9d3dd"/>
  <text x="376" y="578" class="lbl">Aurora Serverless v2</text>
  <text x="376" y="596" class="tiny">PostgreSQL 17.9</text>
  <text x="376" y="613" class="tiny">Flyte metadata</text>
  <text x="376" y="630" class="tiny">scales to zero when idle</text>
  <rect x="590" y="552" width="216" height="86" rx="7" fill="#fff" stroke="#c9d3dd"/>
  <text x="608" y="578" class="lbl">Amazon S3</text>
  <text x="608" y="596" class="tiny">task inputs / outputs</text>
  <text x="608" y="613" class="tiny">data offload</text>
  <rect x="822" y="552" width="192" height="86" rx="7" fill="#fff" stroke="#c9d3dd"/>
  <text x="840" y="578" class="lbl">Amazon ECR</text>
  <text x="840" y="596" class="tiny">task images</text>
  <text x="840" y="613" class="tiny">created on push</text>

  <!-- Notes -->
  <rect x="1060" y="510" width="276" height="150" rx="10" fill="#fff" stroke="#c9d3dd"/>
  <text x="1080" y="536" class="grp">MODES</text>
  <text x="1080" y="562" class="sub" font-weight="700">Prod</text>
  <text x="1080" y="580" class="tiny">custom domain, HTTPS via ACM,</text>
  <text x="1080" y="596" class="tiny">Cognito SSO at the ALB</text>
  <text x="1080" y="622" class="sub" font-weight="700">Eval</text>
  <text x="1080" y="640" class="tiny">direct Elastic IP, CIDR-restricted</text>

  <!-- User + flows -->
  <rect x="62" y="510" width="250" height="86" rx="8" fill="#fff" stroke="#c9d3dd"/>
  <text x="80" y="536" class="lbl">Data scientist</text>
  <text x="80" y="556" class="tiny">browser → console</text>
  <text x="80" y="573" class="tiny">Flyte SDK / CLI → API</text>
  <text x="80" y="590" class="tiny">both authenticate via Cognito</text>

  <path class="flow" d="M312 545 L336 545 L336 258 L354 258"/>
  <path class="flow" d="M644 223 L672 223"/>
  <path class="flow2" d="M644 308 L660 308 L660 250 L672 250"/>
  <path class="flow" d="M760 384 L760 394"/>
  <path d="M950 384 L950 492 L466 492" class="flow" style="marker-end:none"/>
  <path class="flow" d="M466 492 L466 548"/>
  <path class="flow" d="M698 492 L698 548"/>
  <path class="flow" d="M918 492 L918 548"/>
  <path class="flow2" d="M1012 240 L1076 240"/>
  <path class="flow2" d="M1198 246 L1198 256"/>
  <path class="flow2" d="M1198 316 L1198 326"/>
  <path class="flow2" d="M1076 427 L1040 427 L1040 300 L1012 300"/>
  <text x="1046" y="222" class="tiny">activity</text>
  <text x="1016" y="414" class="tiny">start</text>
</svg>
