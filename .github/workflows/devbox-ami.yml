# Builds and publishes the devbox AMI in the SELLER account (747712783559),
# which is where AWS Marketplace requires the AMI to live.
#
# Port of .buildkite/{check-and-build.sh,build-publish.yml}, with the same gate:
# the AMI id is only written to SSM after the smoke test passes, so a deploy
# never picks up an unvalidated image.
name: devbox AMI

on:
  schedule:
    - cron: "0 7 * * *"        # daily; a no-op unless the devbox image changed
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the devbox image digest has not changed"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip the smoke test. Publishes an UNVALIDATED AMI to SSM."
        type: boolean
        default: false
      submit:
        description: "Build a new AMI and submit it to AWS Marketplace as a new version (irreversible; a rejection burns the version title)"
        type: boolean
        default: false
      validate_only:
        description: "With submit: run AWS's validation (Intent=VALIDATE) without creating a version"
        type: boolean
        default: false
      mode:
        description: "With submit: auto picks add-vs-update from the listing. Submitting builds a new AMI, so this resolves to add; update is for listing copy only"
        type: choice
        options: [auto, add, update]
        default: auto

permissions:
  contents: read
  id-token: write             # OIDC assume-role; no long-lived AWS keys

env:
  AWS_REGION: us-east-1
  DEVBOX_IMAGE: cr.flyte.org/flyteorg/flyte-devbox:latest
  DIGEST_PARAM: /flyte-devbox/ami/source-digest
  AMI_PARAM: /flyte-devbox/ami/latest

concurrency:
  group: devbox-ami           # never two packer builds racing for the same SSM pointer
  cancel-in-progress: false

jobs:
  check:
    name: check for a new devbox release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.digest.outputs.build }}
      digest: ${{ steps.digest.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: digest
        run: |
          CURRENT=$(docker buildx imagetools inspect "$DEVBOX_IMAGE" | awk '/^Digest:/{print $2; exit}')
          [ -n "$CURRENT" ] || { echo "could not resolve digest for $DEVBOX_IMAGE" >&2; exit 1; }
          PUBLISHED=$(aws ssm get-parameter --name "$DIGEST_PARAM" --query Parameter.Value --output text 2>/dev/null || echo none)
          echo "current:   $CURRENT"
          echo "published: $PUBLISHED"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          # `submit` forces a build. A Marketplace version is (AMI + template +
          # copy) reviewed as a unit: the template of a published version cannot
          # be changed (UpdateDeliveryOptions rejects Template), and a new
          # version cannot reuse an AMI. So shipping ANY template change needs a
          # fresh AMI, even when the devbox image has not moved.
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.submit }}" = "true" ] || [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new devbox release — nothing to build."
          fi

  build:
    name: packer build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      ami: ${{ steps.packer.outputs.ami }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-packer@v3
      - id: packer
        working-directory: devbox/packer
        run: |
          packer init .
          # The build instance needs a public subnet; the seller account's
          # default VPC provides one in every AZ. Not every AZ offers the build
          # instance type though — us-east-1e has no m6i, and picking Subnets[0]
          # blindly lands there and fails RunInstances with `Unsupported` — so
          # restrict the choice to AZs that actually offer it.
          #
          # Scoped to the DEFAULT VPC, which is not fussiness. The smoke test
          # stands up its own VPC whose public subnets also carry
          # map-public-ip-on-launch=true, so an account-wide search could pick
          # one of those - and did. Two builds failed with "Timeout waiting for
          # SSH" because the instance was launched into a smoke stack's VPC that
          # was being deleted around it; by the time anyone looked, the subnet
          # and VPC no longer existed. Non-blocking teardown makes a smoke VPC
          # far more likely to still be there when the next build starts.
          VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
                  --query 'Vpcs[0].VpcId' --output text)
          [ "$VPC" != "None" ] && [ -n "$VPC" ] || { echo "no default VPC in this account/region" >&2; exit 1; }
          TYPE=$(grep -A2 'variable "instance_type"' flyte-devbox.pkr.hcl | sed -n 's/.*default *= *"\(.*\)"/\1/p')
          AZS=$(aws ec2 describe-instance-type-offerings --location-type availability-zone \
                  --filters Name=instance-type,Values="$TYPE" \
                  --query 'InstanceTypeOfferings[].Location' --output text | tr '\t' ',')
          SUBNET=$(aws ec2 describe-subnets \
                     --filters Name=vpc-id,Values="$VPC" Name=map-public-ip-on-launch,Values=true \
                               "Name=availability-zone,Values=$AZS" \
                     --query 'Subnets[0].SubnetId' --output text)
          [ "$SUBNET" != "None" ] && [ -n "$SUBNET" ] || { echo "no public subnet in the default VPC in an AZ offering $TYPE" >&2; exit 1; }
          echo "building in $VPC / $SUBNET"
          packer build -var subnet_id="$SUBNET" -var vpc_id="$VPC" \
            -var devbox_image="$DEVBOX_IMAGE" -machine-readable . | tee /tmp/packer.log
          AMI=$(grep 'artifact,0,id' /tmp/packer.log | cut -d, -f6 | cut -d: -f2)
          [ -n "$AMI" ] || { echo "packer produced no AMI id" >&2; exit 1; }
          echo "built $AMI"
          echo "ami=$AMI" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke test (deploy -> flyte run -> teardown)
    needs: [check, build]
    if: needs.check.outputs.build == 'true' && !inputs.skip_smoke
    runs-on: ubuntu-latest
    # Real AWS spend: a full devbox stack (EC2 + Aurora + ALB + Cognito). The
    # role needs CloudFormation/RDS/ELB/Cognito rights beyond what publishing
    # uses — see .github/workflows/README.md.
    environment: devbox-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SMOKE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # The default hour is not enough: deploy is ~14 minutes and the
          # pre-clean first waits out any still-deleting previous stack. A
          # 60.5-minute run expired its token mid-wait. Needs the role's
          # MaxSessionDuration raised to match (seller-account-setup.sh).
          role-duration-seconds: 14400
      # The test runs a real workflow against the deployed devbox, so it needs
      # the flyte CLI. Buildkite pip-installed it; the port to GitHub Actions
      # dropped that, and the gap only surfaced once a run got far enough to
      # reach the smoke step. setup-python rather than the system interpreter:
      # Ubuntu's is PEP 668 externally-managed and refuses a plain pip install.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install the flyte CLI
        run: python3 -m pip install --quiet --upgrade flyte
      - run: AMI_ID="${{ needs.build.outputs.ami }}" ./devbox/scripts/smoke-test.sh

  publish:
    name: publish AMI to SSM
    needs: [check, build, smoke]
    # Runs when smoke passed, or when it was deliberately skipped — but never
    # when it ran and failed.
    if: always() && needs.build.result == 'success' && needs.smoke.result != 'failure' && needs.smoke.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          AMI="${{ needs.build.outputs.ami }}"
          aws ssm put-parameter --name "$AMI_PARAM" --type String \
            --data-type aws:ec2:image --value "$AMI" --overwrite
          aws ssm put-parameter --name "$DIGEST_PARAM" --type String \
            --value "${{ needs.check.outputs.digest }}" --overwrite
          echo "published $AMI"
          echo "### devbox AMI \`$AMI\` published" >> "$GITHUB_STEP_SUMMARY"
          echo "Submit it with the \`submit: true\` input, or locally with \`devbox/scripts/package-marketplace.sh && devbox/scripts/submit-version.sh\`." >> "$GITHUB_STEP_SUMMARY"

  # Packaging and submission are split from the AMI build on purpose. Publishing
  # an AMI to SSM is reversible — the next build overwrites it. Submitting a
  # Marketplace version is not: a rejected submission permanently consumes the
  # version title, and Marketplace refuses a new version while one is still
  # processing. So this runs only when asked for, behind a reviewed environment.
  submit:
    name: submit version to AWS Marketplace
    needs: [check, build, publish]
    # Plain `needs` semantics: this runs only if the build, smoke test and SSM
    # publish all succeeded. An earlier version used always() so it could submit
    # a template-only change against the AMI already in SSM - that is not a thing
    # AWS supports, so the special case is gone and with it the reason to bypass
    # normal gating. Submitting always ships a freshly smoke-tested AMI.
    if: inputs.submit
    runs-on: ubuntu-latest
    environment: marketplace-publish     # required reviewers live here
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Marketplace validation alone took 27 minutes on one version, and the
          # job waits for that and then for the apply. The default hour expired
          # mid-poll, after the version had already been submitted - so the job
          # failed while the submission carried on server-side, which is the
          # worst of both. Needs the role's MaxSessionDuration raised to match
          # (seller-account-setup.sh).
          role-duration-seconds: 14400

      # Uploads the buyer-facing template variant and the architecture diagram,
      # and writes devbox/.package-manifest.json with the VERSIONED urls.
      - name: package listing assets
        run: devbox/scripts/package-marketplace.sh

      - name: submit
        env:
          MARKETPLACE_PRODUCT_ID: ${{ vars.DEVBOX_MARKETPLACE_PRODUCT_ID }}
          # Always set: the build job is forced whenever submit is true.
          AMI_ID: ${{ needs.build.outputs.ami }}
          VALIDATE_ONLY: ${{ inputs.validate_only && '1' || '0' }}
          MODE: ${{ inputs.mode }}
        run: devbox/scripts/submit-version.sh
